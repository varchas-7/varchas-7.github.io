
name: Deploy Varchasvi Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v6
        with:
          path: site

      - name: Prepare website directories
        run: |
          mkdir -p site/isha-proposal
          mkdir -p site/wedding-invitation

      - name: Fetch proposal website
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          git clone --depth 1 \
            https://github.com/$OWNER/isha-proposal.git /tmp/proposal

          rsync -a --exclude='.git' \
            /tmp/proposal/ site/isha-proposal/

      - name: Fetch wedding invitation
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          git clone --depth 1 \
            https://github.com/$OWNER/wedding-invitation.git /tmp/wedding

          rsync -a --exclude='.git' \
            /tmp/wedding/ site/wedding-invitation/

      - name: Verify website files
        run: |
          echo "Main website:"
          ls -la site/

          echo "Proposal website:"
          ls -la site/isha-proposal/

          echo "Wedding invitation:"
          ls -la site/wedding-invitation/

          test -f site/index.html
          test -f site/isha-proposal/index.html
          test -f site/wedding-invitation/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
